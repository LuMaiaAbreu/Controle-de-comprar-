// ===================== SUPABASE DATA LAYER =====================
function sbHeaders(extra) {
  return Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
  }, extra || {});
}
async function sbGet(path) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: sbHeaders() });
  if (!res.ok) throw new Error("GET " + path + " -> " + res.status);
  return res.json();
}
async function sbPost(path, body, prefer) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: "POST",
    headers: sbHeaders({ Prefer: prefer || "resolution=merge-duplicates,return=representation" }),
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let txt = "";
    try { txt = await res.text(); } catch (e) {}
    throw new Error("POST " + path + " -> " + res.status + " " + txt);
  }
  return res.json();
}
async function sbDelete(path) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { method: "DELETE", headers: sbHeaders() });
  if (!res.ok) throw new Error("DELETE " + path + " -> " + res.status);
}

function purchaseToRow(p) {
  return { id: p.id, date: p.date, store: p.store, desconto: p.desconto || 0, items: p.items, total_override: (p.totalOverride === undefined ? null : p.totalOverride) };
}
function rowToPurchase(r) {
  return { id: r.id, date: r.date, store: r.store, desconto: Number(r.desconto) || 0, items: r.items, totalOverride: r.total_override != null ? Number(r.total_override) : undefined };
}
async function fetchPurchases() {
  const rows = await sbGet("purchases?select=*&order=date.asc");
  return rows.map(rowToPurchase);
}
async function upsertPurchase(p) { await sbPost("purchases", [purchaseToRow(p)]); }
async function deletePurchaseRow(id) { await sbDelete("purchases?id=eq." + encodeURIComponent(id)); }

async function fetchShoppingList() {
  const rows = await sbGet("shopping_list?select=*");
  return rows.map(r => ({ name: r.name, done: !!r.done }));
}
async function upsertListItem(name, done) { await sbPost("shopping_list", [{ name: name, done: done }]); }
async function deleteListItem(name) { await sbDelete("shopping_list?name=eq." + encodeURIComponent(name)); }
async function clearShoppingListRows() { await sbDelete("shopping_list?name=not.is.null"); }

// ===================== UTILS =====================
function fmt(n) { return (n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { const [y, m, day] = d.split("-"); return day + "/" + m + "/" + y; }
const MONTHS_ABBR = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
function fmtDateShort(d) { const [y, m, day] = d.split("-"); return parseInt(day,10) + " " + MONTHS_ABBR[parseInt(m,10)-1]; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function itemsGross(items) { return items.reduce((s, it) => s + it.qty * it.unitPrice, 0); }
function purchaseTotal(p) {
  if (typeof p.totalOverride === "number") return p.totalOverride;
  return Math.max(0, itemsGross(p.items) - (p.desconto || 0));
}
function weekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const sunday = new Date(d);
  sunday.setDate(d.getDate() - day);
  return sunday.toISOString().slice(0, 10);
}
function weekRangeShort(sundayStr) {
  const start = new Date(sundayStr + "T00:00:00");
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  return fmtDateShort(start.toISOString().slice(0, 10)) + " → " + fmtDateShort(end.toISOString().slice(0, 10));
}
function normalize(s) { return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }

  "Mercearia": ["macarrao", "arroz", "feijao", "acucar", "sal ", "oleo", "farinha", "ketchup", "molho", "extrato de tomate", "cereal", "biscoito", "bolacha", "chocolate", "cafe", "mel", "azeite", "vinagre", "granola", "aveia", "fermento", "gelatina", "sucrilhos", "chandelle", "maionese", "mostarda", "tempero"],
  "Limpeza": ["sacola", "detergente", "sabao em po", "amaciante", "desinfetante", "agua sanitaria", "esponja", "alvejante", "multiuso", "toalha"],
  "Higiene e Perfumaria": ["papel higienico", "sabonete", "shampoo", "xampu", "creme dental", "escova de dente", "absorvente", "fralda", "desodorante"],
};
function classifyItem(name) {
  const n = normalize(name);
  for (const cat of CATEGORY_ORDER) {
    const kws = CATEGORY_KEYWORDS[cat];
    if (!kws) continue;
    if (kws.some(k => n.includes(normalize(k)))) return cat;
  }
  return "Outros";
}

// ===================== STATE =====================
let state = {
  purchases: null,
  shoppingList: [],
  view: "weeks",
  search: "",
  expanded: {},
  loadError: null,
  listStatus: "idle",
  listErrorMsg: "",
};

// ===================== INIT =====================
async function init() {
  state.loadError = null;
  render();
  try {
    let purchases = await fetchPurchases();
    if (purchases.length === 0) {
      for (const p of SEED) await upsertPurchase(p);
      purchases = await fetchPurchases();
    }
    const existingIds = new Set(purchases.map(p => p.id));
    const newOnes = PENDING_IMPORT.filter(p => !existingIds.has(p.id));
    if (newOnes.length) {
      for (const p of newOnes) await upsertPurchase(p);
      purchases = await fetchPurchases();
    }
    state.purchases = purchases;
  } catch (e) {
    console.error(e);
    state.loadError = e.message;
    state.purchases = [];
  }
  try {
    state.shoppingList = await fetchShoppingList();
  } catch (e) {
    console.error(e);
  }
  render();
}

// ===================== DERIVED DATA =====================
function getWeeksDesc() {
  const map = {};
  for (const p of state.purchases) {
    const wk = weekKey(p.date);
    if (!map[wk]) map[wk] = { wk: wk, purchases: [], total: 0 };
    map[wk].purchases.push(p);
    map[wk].total += purchaseTotal(p);
  }
  return Object.values(map).sort((a, b) => b.wk.localeCompare(a.wk));
}
function getWeeksAsc() { return [...getWeeksDesc()].sort((a, b) => a.wk.localeCompare(b.wk)); }
function catalogNames() {
  const seen = new Map();
  for (const p of state.purchases) {
    for (const it of p.items) {
      const key = it.name.trim().toLowerCase();
      if (!seen.has(key)) seen.set(key, it.name.trim());
    }
  }
  return Array.from(seen.values()).sort((a, b) => a.localeCompare(b, "pt-BR"));
}
function groupNamesByCategory(names) {
  const map = {};
  for (const n of names) {
    const cat = classifyItem(n);
    if (!map[cat]) map[cat] = [];
    map[cat].push(n);
  }
  return CATEGORY_ORDER.filter(c => map[c] && map[c].length).map(c => ({ category: c, items: map[c] }));
}
function groupListByCategory(items) {
  const map = {};
  for (const it of items) {
    const cat = classifyItem(it.name);
    if (!map[cat]) map[cat] = [];
    map[cat].push(it);
  }
  return CATEGORY_ORDER.filter(c => map[c] && map[c].length).map(c => ({ category: c, items: map[c] }));
}

function avgPriceForName(name) {
  const key = name.trim().toLowerCase();
  let sum = 0, count = 0;
  for (const p of state.purchases) {
    for (const it of p.items) {
      if (it.name.trim().toLowerCase() === key) { sum += it.unitPrice; count++; }
    }
  }
  return count ? sum / count : null;
}
function estimatedListTotal() {
  return state.shoppingList.reduce((s, it) => s + (avgPriceForName(it.name) || 0), 0);
}
function countItemsWithoutHistory() {
  return state.shoppingList.filter(it => avgPriceForName(it.name) == null).length;
}

// ===================== RENDER =====================
function renderHeaderStats() {
  const grand = (state.purchases || []).reduce((s, p) => s + purchaseTotal(p), 0);
  const weeks = getWeeksDesc();
  const avg = weeks.length ? weeks.reduce((s, w) => s + w.total, 0) / weeks.length : 0;
  document.getElementById("stat-total").textContent = "R$ " + fmt(grand);
  document.getElementById("stat-avg").textContent = "R$ " + fmt(avg);
}

function render() {
  document.querySelectorAll(".tab").forEach(btn => btn.classList.toggle("tab-active", btn.dataset.view === state.view));

  const app = document.getElementById("app");

  if (state.purchases === null) {
    app.innerHTML = '<div class="loading">Carregando...</div>';
    return;
  }

  renderHeaderStats();

  let html = "";
  if (state.loadError) {
    html += '<div class="error-banner">Erro ao carregar dados: ' + escapeHtml(state.loadError) + ' <button data-action="reload">tentar de novo</button></div>';
  }

  if (state.view === "weeks") html += renderWeeksHtml();
  else if (state.view === "grafico") html += renderChartHtml();
  else if (state.view === "precos") html += renderPricesHtml();
  else if (state.view === "lista") html += renderListHtml();

  app.innerHTML = html;
}

function renderWeeksHtml() {
  const weeks = getWeeksDesc();
  if (weeks.length === 0) return '<div class="empty">Nenhuma compra registrada ainda.</div>';
  return '<div class="list">' + weeks.map(w =>
    '<div class="week-card">' +
      '<div class="week-head"><span class="week-title">' + weekRangeShort(w.wk) + '</span><span class="week-total">R$ ' + fmt(w.total) + '</span></div>' +
      w.purchases.map(renderPurchaseRow).join("") +
    '</div>'
  ).join("") + '</div>';
}

function renderPurchaseRow(p) {
  const isOpen = !!state.expanded[p.id];
  let itemsHtml = "";
  if (isOpen) {
    itemsHtml = '<div class="items-table">' +
      p.items.map(it =>
        '<div class="ledger-item"><div class="ledger-line">' +
          '<span class="ledger-label">' + escapeHtml(it.name) + '</span>' +
          '<span class="ledger-leader"></span>' +
          '<span class="ledger-value">R$ ' + fmt(it.qty * it.unitPrice) + '</span>' +
        '</div><div class="ledger-sub">' + it.qty + ' ' + it.unit + ' × R$ ' + fmt(it.unitPrice) + '</div></div>'
      ).join("") +
      (p.desconto > 0 ?
        '<div class="ledger-item"><div class="ledger-line" style="color:var(--stamp)"><span class="ledger-label">Descontos aplicados</span><span class="ledger-leader"></span><span class="ledger-value">− R$ ' + fmt(p.desconto) + '</span></div></div>'
        : "") +
      '</div>';
  }
  return '<div class="purchase-row">' +
    '<div class="purchase-head" data-action="toggle-expand" data-id="' + p.id + '">' +
      '<span class="chevron">' + (isOpen ? "▾" : "▸") + '</span>' +
      '<span class="purchase-store">' + escapeHtml(p.store) + '</span>' +
      '<span class="purchase-total">R$ ' + fmt(purchaseTotal(p)) + '</span>' +
      '<button class="trash-btn" data-action="delete-purchase" data-id="' + p.id + '" title="Remover">✕</button>' +
    '</div>' +
    '<div class="purchase-meta">' + fmtDate(p.date) + '</div>' +
    itemsHtml +
  '</div>';
}

function renderChartHtml() {
  const weeks = getWeeksAsc();
  if (weeks.length === 0) return '<div class="chart-card"><div class="empty">Nenhum dado ainda.</div></div>';
  const max = Math.max(...weeks.map(w => w.total), 1);
  const bars = weeks.map(w =>
    '<div class="bar-col">' +
      '<div class="bar-value">R$ ' + fmt(w.total) + '</div>' +
      '<div class="bar" style="height:' + Math.max(6, (w.total / max) * 160) + 'px"></div>' +
      '<div class="bar-label">' + fmtDateShort(w.wk) + '</div>' +
    '</div>'
  ).join("");
  return '<div class="chart-card"><div class="chart-title">Gasto total por semana</div><div class="bar-chart">' + bars + '</div></div>';
}

function renderPricesHtml() {
  return '<div class="price-card">' +
    '<div class="search-box"><input id="search-input" type="text" value="' + escapeHtml(state.search) + '" placeholder="Buscar item (ex: tomate, cerveja, café...)" /></div>' +
    '<div id="price-rows-container">' + renderPriceRowsInner() + '</div>' +
  '</div>';
}
function renderPriceRowsInner() {
  const q = state.search.trim().toLowerCase();
  if (!q) return '<div class="empty">Digite o nome de um item para ver o histórico de preço.</div>';
  let rows = [];
  for (const p of state.purchases) {
    for (const it of p.items) {
      if (it.name.toLowerCase().includes(q)) {
        rows.push({ date: p.date, store: p.store, name: it.name, qty: it.qty, unit: it.unit, unitPrice: it.unitPrice });
      }
    }
  }
  rows.sort((a, b) => b.date.localeCompare(a.date));
  if (rows.length === 0) return '<div class="empty">Nenhum item encontrado.</div>';
  return '<div style="margin-top:14px">' + rows.map(r =>
    '<div class="ledger-item"><div class="ledger-line">' +
      '<span class="ledger-label">' + escapeHtml(r.name) + '</span>' +
      '<span class="ledger-leader"></span>' +
      '<span class="ledger-value">R$ ' + fmt(r.unitPrice) + '</span>' +
    '</div><div class="ledger-sub">' + fmtDate(r.date) + ' · ' + escapeHtml(r.store.split(" ")[0]) + ' · ' + r.qty + ' ' + r.unit + '</div></div>'
  ).join("") + '</div>';
}

function saveStatusHtml() {
  if (state.listStatus === "saving") return '<span class="save-status">salvando…</span>';
  if (state.listStatus === "saved") return '<span class="save-status" style="color:var(--green)">✓ salvo</span>';
  if (state.listStatus === "error") return '<span class="save-status" style="color:var(--stamp)">Erro: ' + escapeHtml(state.listErrorMsg) + '<button class="retry-link" data-action="retry-list">tentar de novo</button></span>';
  return "";
}

function renderListHtml() {
  const listNamesSet = new Set(state.shoppingList.map(i => i.name.toLowerCase()));
  const sortedList = [...state.shoppingList].sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));
  const grouped = groupListByCategory(sortedList);
  const catalog = catalogNames();
  const catalogGrouped = groupNamesByCategory(catalog);
  const pendentes = state.shoppingList.filter(i => !i.done).length;
  const noHistoryCount = countItemsWithoutHistory();

  return '<div class="price-card">' +
    '<div class="list-head-row">' +
      '<div class="list-head-title">Sua lista' + (state.shoppingList.length ? ' · ' + pendentes + ' pendentes' : '') + '</div>' +
      '<div style="display:flex;align-items:center;gap:10px">' + saveStatusHtml() +
        (state.shoppingList.length ? '<button class="clear-btn" data-action="clear-list">Limpar</button>' : '') +
      '</div>' +
    '</div>' +
    (state.shoppingList.length > 0 ?
      '<div class="predicted-total-row"><span class="predicted-total-k">PREVISTO PARA A COMPRA</span><span class="predicted-total-v">R$ ' + fmt(estimatedListTotal()) + '</span></div>' +
      (noHistoryCount > 0 ? '<div class="predicted-note">' + noHistoryCount + ' ' + (noHistoryCount === 1 ? 'item ainda não tem' : 'itens ainda não têm') + ' histórico de preço e não entram nessa conta.</div>' : '')
      : '') +
    (state.shoppingList.length === 0 ?
      '<div class="empty">Nenhum item selecionado ainda. Marque itens no catálogo abaixo.</div>' :
      '<div style="margin-bottom:28px">' + grouped.map(g =>
        '<div class="category-block"><div class="category-title">' + g.category + '</div>' +
        g.items.map(it => {
          const avg = avgPriceForName(it.name);
          return '<label class="list-check-row"><input type="checkbox" data-action="toggle-done" data-name="' + escapeHtml(it.name) + '" ' + (it.done ? "checked" : "") + ' />' +
          '<span class="ledger-label" style="' + (it.done ? "text-decoration:line-through;color:#b3a98d" : "") + '">' + escapeHtml(it.name) + '</span>' +
          '<span class="ledger-leader"></span>' +
          '<span class="list-item-price">' + (avg != null ? "~R$ " + fmt(avg) : "—") + '</span></label>';
        }).join("") + '</div>'
      ).join("") + '</div>'
    ) +
    '<div style="border-top:1px solid var(--rule);padding-top:18px">' +
      '<div class="category-title" style="border-bottom:none;margin-bottom:10px">Itens de compras anteriores</div>' +
      '<div class="catalog-list">' + catalogGrouped.map(g =>
        '<div class="category-block"><div class="category-title">' + g.category + '</div>' +
        g.items.map(name => {
          const avg = avgPriceForName(name);
          return '<label class="list-check-row"><input type="checkbox" data-action="toggle-catalog" data-name="' + escapeHtml(name) + '" ' + (listNamesSet.has(name.toLowerCase()) ? "checked" : "") + ' />' +
          '<span class="ledger-label">' + escapeHtml(name) + '</span>' +
          '<span class="ledger-leader"></span>' +
          '<span class="list-item-price">' + (avg != null ? "~R$ " + fmt(avg) : "") + '</span></label>';
        }).join("") + '</div>'
      ).join("") + '</div>' +
      '<div class="custom-add-row"><input id="custom-item-input" type="text" placeholder="Item novo (ex: fósforo)" /><button class="add-small-btn" data-action="add-custom">Adicionar</button></div>' +
    '</div>' +
  '</div>';
}

// ===================== ACTIONS =====================
async function toggleListMembership(name, add) {
  if (add) {
    if (!state.shoppingList.some(i => i.name.toLowerCase() === name.toLowerCase())) {
      state.shoppingList = state.shoppingList.concat([{ name: name, done: false }]);
    }
  } else {
    state.shoppingList = state.shoppingList.filter(i => i.name.toLowerCase() !== name.toLowerCase());
  }
  state.listStatus = "saving";
  render();
  try {
    if (add) await upsertListItem(name, false); else await deleteListItem(name);
    state.listStatus = "saved";
    render();
    setTimeout(() => { if (state.listStatus === "saved") { state.listStatus = "idle"; render(); } }, 1200);
  } catch (e) {
    state.listStatus = "error"; state.listErrorMsg = e.message; render();
  }
}
async function setItemDone(name, done) {
  state.shoppingList = state.shoppingList.map(i => i.name === name ? Object.assign({}, i, { done: done }) : i);
  state.listStatus = "saving";
  render();
  try {
    await upsertListItem(name, done);
    state.listStatus = "saved";
    render();
    setTimeout(() => { if (state.listStatus === "saved") { state.listStatus = "idle"; render(); } }, 1200);
  } catch (e) {
    state.listStatus = "error"; state.listErrorMsg = e.message; render();
  }
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => { state.view = btn.dataset.view; render(); });
});

document.getElementById("app").addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "toggle-expand") {
    state.expanded[el.dataset.id] = !state.expanded[el.dataset.id];
    render();
  } else if (action === "delete-purchase") {
    e.stopPropagation();
    if (!confirm("Remover essa compra?")) return;
    try {
      await deletePurchaseRow(el.dataset.id);
      state.purchases = state.purchases.filter(p => p.id !== el.dataset.id);
      render();
    } catch (err) { alert("Erro ao remover: " + err.message); }
  } else if (action === "clear-list") {
    if (!confirm("Limpar toda a lista?")) return;
    state.listStatus = "saving"; render();
    try {
      await clearShoppingListRows();
      state.shoppingList = [];
      state.listStatus = "saved"; render();
      setTimeout(() => { if (state.listStatus === "saved") { state.listStatus = "idle"; render(); } }, 1200);
    } catch (err) { state.listStatus = "error"; state.listErrorMsg = err.message; render(); }
  } else if (action === "retry-list") {
    state.listStatus = "saving"; render();
    try {
      state.shoppingList = await fetchShoppingList();
      state.listStatus = "saved"; render();
    } catch (err) { state.listStatus = "error"; state.listErrorMsg = err.message; render(); }
  } else if (action === "add-custom") {
    const input = document.getElementById("custom-item-input");
    const name = (input.value || "").trim();
    if (!name) return;
    input.value = "";
    await toggleListMembership(name, true);
  } else if (action === "reload") {
    state.purchases = null; init();
  }
});

document.getElementById("app").addEventListener("change", async (e) => {
  if (e.target.dataset.action === "toggle-catalog") {
    await toggleListMembership(e.target.dataset.name, e.target.checked);
  } else if (e.target.dataset.action === "toggle-done") {
    await setItemDone(e.target.dataset.name, e.target.checked);
  }
});

document.getElementById("app").addEventListener("input", (e) => {
  if (e.target.id === "search-input") {
    state.search = e.target.value;
    const container = document.getElementById("price-rows-container");
    if (container) container.innerHTML = renderPriceRowsInner();
  }
});

init();
</script>
</body>
